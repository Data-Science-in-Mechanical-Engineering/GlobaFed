[project]
name = "fedbo"
version = "0.1.0"
description = "Simulation for Federated Bayesian Optimization using Neural Networks"
authors = [
    { name = "Max van Gemmeren" },
]
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "jaxtyping (>=0.3.1,<0.4.0)",
    "optax (>=0.2.4,<0.3.0)",
    "optimistix (>=0.0.10,<0.0.11)",
    "matplotlib (>=3.10.1,<4.0.0)",
    "hydra-core (>=1.3.2,<2.0.0)",
    "hydra-submitit-launcher (>=1.2.0,<2.0.0)",
    "wandb (>=0.19.10,<0.20.0)",
    "scipy (>=1.15.2,<2.0.0)",
    "plotly (>=6.1.2,<7.0.0)",
    "botorch (>=0.14.0,<0.15.0)",
    "jaxopt (>=0.8.5,<0.9.0)",
    "scikit-learn (>=1.7.1,<2.0.0)",
    "gymnasium[classic-control] (>=1.2.0,<2.0.0)",
    "scikit-optimize (>=0.10.2,<0.11.0)",
    "ipykernel (>=6.30.1,<7.0.0)",
    "pandas (>=2.3.2,<3.0.0)",
    "imageio (>=2.37.0,<3.0.0)",
    "distrax (>=0.1.7,<0.2.0)",
    "jax (>=0.7.1,<0.8.0)",
    "equinox (>=0.13.0,<0.14.0)",
    "multiprocess (>=0.70.18,<0.71.0)",
    "ray (>=2.49.1,<3.0.0)",
    "rwthcolors (>=0.3.0,<0.4.0)",
    "scikit-posthocs (>=0.11.4,<0.12.0)",
    "critdd @ git+https://github.com/mirkobunse/critdd",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
