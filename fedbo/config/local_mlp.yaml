defaults:
  - agent: base
  - dataset: ackley10d
  - transformations: shift
  - model: mlp
  - trainer: local
  - acquisition: thompson
  - logger: wandb
  - _self_

_target_: fedbo.utils.hydra.MainConfig
_convert_: all

seed: 0
num_agents: 10

# Overrides
bayesopt:
  _target_: fedbo.optimization.BayesOpt.hydra_init
  num_iterations: 50

trainer:
  train_cfg:
    num_epochs: 6000
    optimizer:
      learning_rate: 1e-4

model:
  hidden_features: 64
  num_hidden_layers: 4

logger:
  project: ${oc.env:WANDB_PROJECT,ackley10d}
  name: Local-MLP/#Agents-${num_agents}/S-${seed}
