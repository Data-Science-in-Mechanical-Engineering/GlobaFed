defaults:
  - agent: base
  - dataset: ackley10d
  - transformations: shift
  - model: vbll
  - trainer: federated
  - acquisition: thompson
  - logger: wandb
  - _self_

_target_: fedbo.utils.hydra.MainConfig
_convert_: all

seed: 0
num_agents: 10

# Overrides
bayesopt:
  _target_: fedbo.optimization.BayesOpt.hydra_init
  num_iterations: 50
  log_acquisition: false

trainer:
  num_rounds: 100
  train_cfg:
    num_epochs: 10
    optimizer:
      _target_: fedbo.models.vbll.vbll_optimizer
      max_norm: 1.0
      learning_rate: 1e-3
    loss_function:
      _target_: fedbo.training.loss.VBLLLoss
  train_head_cfg:
    num_epochs: 50
    optimizer:
      _target_: fedbo.models.vbll.vbll_optimizer
      max_norm: 1.0
      learning_rate: 1e-3
    loss_function:
      _target_: fedbo.training.loss.VBLLLoss
  aggregator_cfg:
    optimizer:
      learning_rate: 8e-3


model:
  hidden_features: 64
  num_hidden_layers: 6
  reg_factor: 1.0
  parameterization: "dense"
  prior_scale: 10.0
  wishart_scale: 1.0
  dof: 25.0

logger:
  project: ${oc.env:WANDB_PROJECT,ackley10d}
  name: FL-VBLL/#Agents-${num_agents}/S-${seed}
